<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="DejaVu Sans Mono, monospace">
  <rect width="760" height="420" rx="10" fill="#0a0e12"/>
  <rect x="0" y="0" width="760" height="30" rx="10" fill="#141a1f"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="15" r="6" fill="#febc2e"/>
  <circle cx="60" cy="15" r="6" fill="#28c840"/>
  <text x="380" y="19" fill="#7a8a90" font-size="12" text-anchor="middle">blackghost@kali: ~/MutaGhost</text>
  <text x="24" y="60" fill="#6ee7b0" font-size="16" font-weight="bold">MutaGhost</text>
  <text x="24" y="82" fill="#5f7a78" font-size="12">v1.0.0  |  derived from Psudohash by t3l3machus  |  Black-ghost7</text>
  <text x="24" y="120" fill="#aef0da" font-size="14" font-weight="bold">Interactive setup</text>
  <text x="24" y="138" fill="#5f7a78" font-size="12">(press Enter to accept the default)</text>
  <text x="24" y="170" fill="#e8fff6" font-size="13">Keywords, comma separated:</text>
  <text x="330" y="170" fill="#6ee7ff" font-size="13">ghost, blackhat</text>
  <text x="24" y="196" fill="#e8fff6" font-size="13">Also read keywords from a file (Enter to skip):</text>
  <text x="24" y="222" fill="#e8fff6" font-size="13">Append numbering after each word? digits (Enter to skip):</text>
  <text x="520" y="222" fill="#6ee7ff" font-size="13">2</text>
  <text x="24" y="248" fill="#e8fff6" font-size="13">Years to append, e.g. 1990-2024 (Enter to skip):</text>
  <text x="430" y="248" fill="#6ee7ff" font-size="13">2015-2025</text>
  <text x="24" y="274" fill="#e8fff6" font-size="13">Add common paddings AFTER each word? [y/N]:</text>
  <text x="400" y="274" fill="#6ee7ff" font-size="13">y</text>
  <text x="24" y="300" fill="#e8fff6" font-size="13">Add common paddings BEFORE each word? [y/N]:</text>
  <text x="400" y="300" fill="#6ee7ff" font-size="13">n</text>
  <text x="24" y="326" fill="#e8fff6" font-size="13">Output file [mutaghost_output.txt]:</text>
  <rect x="24" y="356" width="712" height="42" rx="6" fill="#0f1620" stroke="#1d3b36"/>
  <text x="36" y="382" fill="#ffd166" font-size="13">[!] This will write exactly 48,216 words (430.1 KB) to mutaghost_output.txt</text>
